<!-- Er Portal Home -->
<template>

  <c-er-portal-breadcrumbs token={crn} mode="view" rec-id={key} scope={scope}></c-er-portal-breadcrumbs>

  <hgroup class="show-ease">
    <h2>
      <lightning-formatted-text value={labels.lb_homepage_title}></lightning-formatted-text>
    </h2>
  </hgroup>
  <div class="form show-ease">
    <div class="left-ribbon"></div>

    <fieldset class="slds-form-element slds-form-element_compound">
      <div class="slds-form-element__control">
        <template if:true={hasCheckedEnterpriseNb}>
          <hgroup class="show-ease">
            <h3>
              <lightning-formatted-text value={labels.lb_step1}></lightning-formatted-text>
            </h3>
          </hgroup>
          <div class="slds-box slds-theme_default form-block-border">
            <div class="slds-form-element__row slds-p-top_xxx-small slds-p-bottom_xxx-small">
              <div class="field-form slds-m-right_large">
                <c-er-portal-input
                        property-name="legalName"
                        place-holder-text=""
                        input-label={labels.lb_name}
                        value={companyInfos.legalName}
                        required="true"
                        disabled="true"
                        onchange={handleCompanyInfos}
                >
                </c-er-portal-input>
              </div>
              <div class="field-form slds-m-left_large">
                <c-er-portal-input
                        property-name="enterpriseNb"
                        place-holder-text={labels.lb_enterprise_nb_format}
                        input-label={labels.lb_oa_enterprise_nb}
                        value={companyInfos.enterpriseNb}
                        required="true"
                        disabled="true"
                        onchange={handleCompanyInfos}
                        onkeyup={handleRegNbLength}
                >
                </c-er-portal-input>
              </div>
            </div>

            <div class="slds-form-element__row slds-p-top_xxx-small slds-p-bottom_xxx-small">
              <div class="field-form slds-m-right_large">
                <c-er-portal-input
                        property-name="address"
                        place-holder-text=""
                        input-label={labels.lb_step1_street}
                        value={companyInfos.address}
                        required="true"
                        disabled="true"
                        onchange={handleCompanyInfos}
                >
                </c-er-portal-input>
              </div>
              <div class="field-form slds-m-left_large">
                <c-er-portal-input
                        property-name="city"
                        place-holder-text=""
                        input-label={labels.lb_step1_city}
                        value={companyInfos.city}
                        required="true"
                        disabled="true"
                        onchange={handleCompanyInfos}
                >
                </c-er-portal-input>
              </div>
            </div>
            <div class="slds-form-element__row slds-p-top_xxx-small slds-p-bottom_xxx-small">
              <div class="field-form slds-m-right_large">
                <c-er-portal-input
                        property-name="postalCode"
                        disabled="true"
                        place-holder-text=""
                        input-label={labels.lb_step1_postal_code}
                        value={companyInfos.postalCode}
                        required="true"
                        onchange={handleCompanyInfos}
                >
                </c-er-portal-input>
              </div>
              <div class="field-form slds-m-left_large">
                <c-er-portal-picklist
                        property-name="country"
                        place-holder-text=""
                        disabled="true"
                        input-label={labels.lb_step1_country}
                        value={companyInfos.country}
                        pk-entries={picklistGroup.country}
                        required="true"
                        display-cur-value="true"
                        onchange={handleCompanyInfos}
                >
                </c-er-portal-picklist>
              </div>
            </div>
          </div>
          <div class="row-spacing">
            <hgroup class="show-ease">
              <h3>
                <lightning-formatted-text value={labels.lb_contact_person}></lightning-formatted-text>
              </h3>
            </hgroup>
            <div class="slds-box slds-theme_default form-block-border">
              <div class="slds-form-element__row slds-p-top_xxx-small slds-p-bottom_xxx-small">
                <div class="field-form field-form-below-text slds-m-right_large">
                  <c-er-portal-input
                    property-name="firstName"
                    place-holder-text={labels.lb_firstname_place_holder}
                    input-label={labels.lb_step1_firstname}
                    disabled="true"
                    value={companyInfos.firstName}
                  >
                  </c-er-portal-input>
                </div>
                <div class="field-form field-form-below-text slds-m-left_large">
                  <c-er-portal-input
                    property-name="lastName"
                    place-holder-text={labels.lb_lastname_place_holder}
                    input-label={labels.lb_lastname}
                    disabled="true"
                    value={companyInfos.lastName}
                  >
                  </c-er-portal-input>
                </div>
              </div>

              <div class="slds-form-element__row slds-p-top_xxx-small slds-p-bottom_xxx-small">
                <div class="field-form slds-m-right_large">
                  <c-er-portal-input
                    property-name="email"
                    place-holder-text={labels.lb_email_place_holder}
                    input-label={labels.lb_step1_email}
                    disabled="true"
                    value={companyInfos.email}
                  >
                  </c-er-portal-input>
                </div>
                <div class="field-form slds-m-left_large">
                  <c-er-portal-input
                          property-name="contactPhone"
                          place-holder-text={labels.lb_phone_place_holder}
                          disabled="true"
                          input-label={labels.lb_phone_nb}
                          value={companyInfos.mobile}
                  >
                  </c-er-portal-input>
                </div>
              </div>
            </div>
          </div>
          <template if:true={hasFinCenter}>
            <div class="slds-form-element__row">
              <hgroup class="slds-m-bottom_xxx-small">
                <h4>
                  <lightning-formatted-text value={labels.lb_homepage_reimbursement}></lightning-formatted-text>
                </h4>
              </hgroup>
            </div>

            <div class="slds-form-element__row slds-p-top_xxx-small data-table-responsive">
              <div class="table-form">
                <c-er-portal-data-table
                  property-name="finCentersList"
                  data-id="finCentersList"
                  table-datas={finCentersList}
                  table-style="vertical"
                  display-columns={finCentersListTableColumns}
                  is-read-only="false"
                  labels={tableLabels}
                >
                </c-er-portal-data-table>
                <template if:true={showAddFinCenter}>
                  <div class="slds-form-element__row slds-p-bottom_large button__right">
                    <div class="slds-size_4-of-12 slds-m-left_medium add-item">
                      <c-er-portal-button
                        label={labels.lb_add}
                        size="small"
                        alignment="right"
                        onclick={newFinCenter}
                        responsive="x-large"
                        responsive-left="true"
                      ></c-er-portal-button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </template>
      </div>
    </fieldset>
  </div>
</template>
