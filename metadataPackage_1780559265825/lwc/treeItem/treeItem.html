<template>
  <template if:true={isRoot}>
    <template for:each={children} for:item="item" for:index="index">
      <template if:true={item.node.isLeaf}>
        <c-tree-item
          data-key={item.node.key}
          key={item.node.key}
          node-key={item.node.key}
          aria-selected={item.selected}
          aria-level={item.node.level}
          aria-disabled={item.node.isDisabled}
          label={item.node.label}
          is-checked={item.node.isChecked}
          item-id={item.node.itemId}
          href={item.node.href}
          node-ref={item.node.nodeRef}
          is-expanded={item.node.isExpanded}
          is-disabled={item.node.isDisabled}
          focused-child={item.node.focusedChild}
          is-leaf={item.node.isLeaf}
          child-items={item.node.children}
        >
        </c-tree-item>
      </template>
      <template if:false={item.node.isLeaf}>
        <c-tree-item
          data-key={item.node.key}
          key={item.node.key}
          node-key={item.node.key}
          aria-selected={item.selected}
          aria-level={item.node.level}
          label={item.node.label}
          is-checked={item.node.isChecked}
          item-id={item.node.itemId}
          href={item.node.href}
          node-ref={item.node.nodeRef}
          is-expanded={item.node.isExpanded}
          is-disabled={item.node.isDisabled}
          focused-child={item.node.focusedChild}
          is-leaf={item.node.isLeaf}
          child-items={item.node.children}
          aria-label={item.node.label}
          aria-expanded={item.node.strexpanded}
          aria-disabled={item.node.isDisabled}
        >
        </c-tree-item>
      </template>
    </template>
  </template>
  <template if:false={isRoot}>
    <div class="slds-tree__item" onclick={handleClick}>
      <button type="button" class={computedButtonClass} tabindex="-1" aria-hidden="true" title={buttonLabel}>
        <c-primitive-icon
          icon-name={computedIconName}
          variant="bare"
          svg-class="slds-button__icon slds-button__icon_small"
        >
        </c-primitive-icon>
        <span class="slds-assistive-text"> {buttonLabel} </span>
      </button>
      <span class="slds-has-flexi-truncate">
        <template if:true={isDisabled}>
          <span class="slds-tree__item-label slds-truncate" title={label}> {label} </span>
        </template>
        <template if:false={isDisabled}>
          <template if:false={hasChildren}>
            <lightning-input type="checkbox" label={label} checked={isChecked}></lightning-input>
          </template>
          <template if:true={hasChildren}> {label} </template>
          <a href={href} tabindex="-1" role="presentation">
            <span class="slds-tree__item-label slds-truncate" title={label}> </span>
          </a>
        </template>
      </span>
    </div>
    <template if:true={showExpanded}>
      <div role="group">
        <template for:each={children} for:item="item">
          <template if:true={item.node.isLeaf}>
            <c-tree-item
              data-key={item.node.key}
              key={item.node.key}
              node-key={item.node.key}
              aria-selected={item.selected}
              aria-level={item.node.level}
              aria-disabled={item.node.isDisabled}
              label={item.node.label}
              is-checked={item.node.isChecked}
              item-id={item.node.itemId}
              href={item.node.href}
              node-ref={item.node.nodeRef}
              is-expanded={item.node.isExpanded}
              is-disabled={item.node.isDisabled}
              focused-child={item.node.focusedChild}
              is-leaf={item.node.isLeaf}
              child-items={item.node.children}
            >
            </c-tree-item>
          </template>
          <template if:false={item.node.isLeaf}>
            <c-tree-item
              data-key={item.node.key}
              key={item.node.key}
              node-key={item.node.key}
              aria-selected={item.selected}
              aria-level={item.node.level}
              aria-disabled={item.node.isDisabled}
              label={item.node.label}
              is-checked={item.node.isChecked}
              item-id={item.node.itemId}
              href={item.node.href}
              node-ref={item.node.nodeRef}
              is-expanded={item.node.isExpanded}
              is-disabled={item.node.isDisabled}
              focused-child={item.node.focusedChild}
              is-leaf={item.node.isLeaf}
              child-items={item.node.children}
              aria-label={item.node.label}
              aria-expanded={item.node.strexpanded}
            >
            </c-tree-item>
          </template>
        </template>
      </div>
    </template>
  </template>
</template>
