    <template if:true={productMap.Delivery}>
        <div class="delivery-div delivery-tbl">
        <table class="slds-table tbl-right slds-table_cell-buffer slds-table_bordered">
            <thead>
                <tr>
                    <th scope="col">
                        {label.cardDelivery}
                    </th>
                    <th scope="col">
                        {label.price}
                    </th>
                </tr>
            </thead>
            <tbody>
                <template for:each={productMap.Delivery} for:item="delivery">
                    <tr key={delivery.productId}>
                        <!-- <td>
                            {delivery.minValue} <lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon> {delivery.maxValue} 
                        </td> -->

                        <td>
                            <div class="label-with-tooltip">
                                <span>
                                    {delivery.minValue} 
                                    <lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon> 
                                    {delivery.maxValue}
                                </span>
                                <!-- Tooltip Icon -->
                                <template if:true={delivery.helpText}>
                                    <div class="tooltip-container">
                                        <lightning-icon 
                                            icon-name="utility:info" 
                                            size="x-small" 
                                            class="info-icon"
                                            alternative-text="Help">
                                        </lightning-icon>
                                        <div class="tooltip-text">
                                            {delivery.helpText}
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </td>
                        
                        <template if:true={delivery.isDiscountedItem}>
                            <td>
                                <span class="text-green">{label.freeLabel}&nbsp;</span> 
                                <s>
                                    <template if:true={isCurrencyBefore}>{euro}&nbsp;{delivery.unitPrice}</template>
                                    <template if:false={isCurrencyBefore}>{delivery.unitPrice}&nbsp;{euro}</template>
                                    &nbsp;/&nbsp;{delivery.deliveryUnit}
                                </s>
                            </td>
                        </template>
                        <template if:false={delivery.isDiscountedItem}>
                            <td>
                                <span>
                                    <template if:true={isCurrencyBefore}>{euro}&nbsp;{delivery.unitPrice}</template>
                                    <template if:false={isCurrencyBefore}>{delivery.unitPrice}&nbsp;{euro}</template>
                                </span> / {delivery.deliveryUnit}
                            </td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
        </div>
    </template>

    <template if:true={productMap.Card}>
        <div class="card-div delivery-tbl">
        <table class="slds-table tbl-right slds-table_cell-buffer slds-table_bordered">
            <thead>
                <tr>
                    <th scope="col">
                        {label.pricing}
                    </th>
                    <th scope="col">
                        {label.unitPrice}
                    </th>
                </tr>
            </thead>
            <tbody>
                <template for:each={productMap.Card} for:item="card">
                    <tr key={card.productId}>
                        <!-- <td>
                            {card.productName}
                        </td> -->

                        <td>
                            <div class="label-with-tooltip">
                                <span>{card.productName}</span>
                                <!-- Tooltip Icon -->
                                <template if:true={card.helpText}>
                                    <div class="tooltip-container">
                                        <lightning-icon 
                                            icon-name="utility:info" 
                                            size="x-small" 
                                            class="info-icon"
                                            alternative-text="Help">
                                        </lightning-icon>
                                        <div class="tooltip-text">
                                            {card.helpText}
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </td>
                        <!-- Discounted -->
                        <template if:true={card.isDiscountedItem}>
                            <td>
                                <template if:true={card.percentage}>
                                    <span class="text-green">{label.freeLabel}&nbsp;</span> <s>{card.percentage}&nbsp;%</s>
                                </template>
                                <template if:false={card.percentage}>
                                    <span class="text-green">{label.freeLabel}&nbsp;</span> 
                                    <s>
                                        <template if:true={isCurrencyBefore}>{euro}&nbsp;{card.unitPrice}</template>
                                        <template if:false={isCurrencyBefore}>{card.unitPrice}&nbsp;{euro}</template>
                                    </s>
                                </template>
                            </td>
                        </template>
                        <!-- Not Discounted -->
                        <template if:false={card.isDiscountedItem}>
                            <td>
                                <template if:true={card.percentage}>
                                    {card.percentage}&nbsp;%
                                </template>
                                <template if:false={card.percentage}>
                                    <template if:true={isCurrencyBefore}>{euro}&nbsp;{card.unitPrice}</template>
                                    <template if:false={isCurrencyBefore}>{card.unitPrice}&nbsp;{euro}</template>
                                </template>
                            </td>
                        </template>
                    </tr>
                </template>
                <!-- Adding new part -->
                </tbody>
        </table>
    </div>
</template>

                                        <template if:false={isWebOffer}>

                                    <!-- Tooltip Icon -->

                                                size="x-small" 
                                                class="info-icon"

                                            <div class="tooltip-text">

                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </td>

                            <!-- Discounted -->
                            <template if:true={service.isDiscountedItem}>
                                <td>
                                    <template if:true={service.percentage}>
                                        <!-- Removing discountPrice from the class -->
                                        <span class="text-green" data-id={service.productId}>
                                            {service.discountedPercentage}%
                                        </span>
                                        &nbsp;
                                        <s data-id={service.productId}>{service.percentage}%</s>
                                    </template>

                                    <template if:false={service.percentage}>
                                        <s data-id={service.productId}>
                                            <template if:true={isCurrencyBefore}>{euro}&nbsp;{service.unitPrice}</template>
                                            <template if:false={isCurrencyBefore}>{service.unitPrice}&nbsp;{euro}</template>
                                        </s>
                                        &nbsp;

                                        <span class="text-green" data-id={service.productId}>
                                            <template if:true={isCurrencyBefore}>{euro}&nbsp;{service.discountedunitPrice}</template>
                                            <template if:false={isCurrencyBefore}>{service.discountedunitPrice}&nbsp;{euro}</template>
                                        </span>
                                    </template>
                                </td>
                            </template>

                            <!-- Not discounted -->
                            <template if:false={service.isDiscountedItem}>
                                <td>
                                    <template if:true={service.percentage}>
                                        {service.percentage}%
                                    </template>
                                    <template if:false={service.percentage}>
                                        <template if:true={isCurrencyBefore}>{euro}&nbsp;{service.unitPrice}</template>
                                        <template if:false={isCurrencyBefore}>{service.unitPrice}&nbsp;{euro}</template>
                                    </template>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

    <template if:true={showPromoComp}>
        <div class="">
            <p class="counter-label">
                {label.promoQuestionLabel}
            </p>
            <lightning-input
                        type="toggle"
                        class="toggle-custom"
                        name="hasPromoCode"
                        variant="label-hidden"
                        checked={hasPromoCode}
                        onchange={handleInputChange}
                        data-form-element
                        message-toggle-active={label.yesLabel}
                        message-toggle-inactive={label.noLabel}
                        disabled={isWebOffer}
                    ></lightning-input>
        </div>
        <template if:true={hasPromoCode}>
                    <!-- Row 1: Name and Street -->
                    <div class="promocode">
                        <lightning-input class={promoInputClass} name="promoCode" label={label.enterPromoLabel} value={promoCode}
                            onchange={handleInputChange} onkeypress={handleApplyPromo} required data-form-element disabled={isWebOffer}>
                        </lightning-input>
                        
                        <template if:true={showPromoError}>
                            <div class="errormessage helpmessage">
                            <lightning-icon icon-name="action:close" size="x-small"></lightning-icon>
                            <p>{label.promoErrorMessage}</p>
                            </div>
                        </template>
                        <template if:true={showPromoSuccess}>
                            <div class="successmessage helpmessage">
                                <lightning-icon icon-name="action:check" size="x-small"></lightning-icon>
                                <p>{label.promoSuccessMessage} 🎉</p>
                            </div>
                        </template>
                    </div>
                    <template if:true={showPromoSuccess}>
                        <div class="" style="margin: 2rem 1rem;font-weight: 500;">
                            <h2>{promoDescription}</h2>
                        </div>
                    </template>
                    
        </template>
    </template>
