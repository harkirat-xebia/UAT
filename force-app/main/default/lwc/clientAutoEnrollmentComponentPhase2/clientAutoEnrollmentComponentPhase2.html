<template>
    <div class="header-top">
        <h2>{label.header}</h2>
        <p>{label.subHeader}</p>
    </div>
    <div class="content">
        <!-- Before company lookup: enter identifier(s) -->
        <template if:false={hasEnterpriseNumber}>
            <div class="slds-grid slds-wrap slds-gutters">
                <!-- LU: RCS Number field -->
                <template if:true={isLU}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_12-of-12 slds-large-size_12-of-12">
                        <div class="field-label-row">
                            <span class="field-label-text">{label.rcsNum}</span>
                            <c-rich-helptext
                                content={label.rcsHelp}
                                link-url={lbrUrl}
                                link-label={label.rcsLinkLabel}>
                            </c-rich-helptext>
                        </div>
                        <lightning-input name="enterpriseNumber"
                            label={label.rcsNum}
                            variant="label-hidden"
                            value={enterpriseNumber}
                            placeholder={label.rcsNumPlaceholder}
                            onchange={handleInputChange}
                            required=true data-form-element disabled={isWebOffer}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_12-of-12 slds-large-size_12-of-12">
                        <div class="field-label-row">
                            <span class="field-label-text">{label.registrationNum}</span>
                            <c-rich-helptext
                                content={label.registrationHelp}>
                            </c-rich-helptext>
                        </div>
                        <lightning-input name="registrationNumber"
                            label={label.registrationNum}
                            variant="label-hidden"
                            value={registrationNumber}
                            placeholder={label.registrationNumPlaceholder}
                            onchange={handleInputChange}
                            required=true data-form-element disabled={isWebOffer}>
                        </lightning-input>
                    </div>
                </template>
                <!-- BE: Enterprise Number field -->
                <template if:false={isLU}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_12-of-12 slds-large-size_12-of-12">
                        <lightning-input name="enterpriseNumber"
                            label={label.enterpriseNum}
                            field-level-help={label.enterpriseHelp}
                            value={enterpriseNumber}
                            placeholder={label.enterpriseNumPlaceholder}
                            onchange={handleInputChange}
                            required=true data-form-element disabled={isWebOffer}>
                        </lightning-input>
                    </div>
                </template>
            </div>
        </template>

        <!-- After company lookup: full company details form -->
        <template if:true={hasEnterpriseNumber}>
            <div class="slds-grid slds-wrap slds-gutters">

                <!-- Identifier field: always full-width at the top -->
                <div class="slds-col slds-size_1-of-1">
                    <lightning-input name="enterpriseNumber" label={enterpriseNum} value={enterpriseNumber}
                        onchange={handleInputChange} read-only=true disabled data-form-element>
                    </lightning-input>
                </div>

                <!-- LU: NIF | Business Name, then Commercial Name | Code TVA -->
                <template if:true={isLU}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                        <div class="field-label-row">
                            <span class="field-label-text">{label.registrationNum}</span>
                            <c-rich-helptext
                                content={label.registrationHelp}>
                            </c-rich-helptext>
                        </div>
                        <lightning-input name="registrationNumber" label={label.registrationNum}
                            variant="label-hidden"
                            placeholder={label.registrationNumPlaceholder} value={registrationNumber}
                            onchange={handleInputChange} required data-form-element>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                        <lightning-input name="businessName" label={label.companyName}
                            placeholder={label.companyNamePlaceholder} value={businessName} onchange={handleInputChange}
                            required data-form-element disabled={lockCompanyFields} read-only={lockCompanyFields}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                        <lightning-input name="commercialName" label={label.commercialName}
                            placeholder={label.commercialNamePlaceholder} value={commercialName}
                            onchange={handleInputChange} required data-form-element>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                        <lightning-input name="codeTVA" label={label.codeTVA} value={codeTVA} onchange={handleInputChange}
                            data-form-element>
                        </lightning-input>
                    </div>
                </template>

                <!-- BE: Business Name | Commercial Name, then Code TVA -->
                <template if:false={isLU}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                        <lightning-input name="businessName" label={label.companyName}
                            placeholder={label.companyNamePlaceholder} value={businessName} onchange={handleInputChange}
                            required data-form-element disabled={lockCompanyFields} read-only={lockCompanyFields}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                        <lightning-input name="commercialName" label={label.commercialName}
                            placeholder={label.commercialNamePlaceholder} value={commercialName}
                            onchange={handleInputChange} required data-form-element>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                        <lightning-input name="codeTVA" label={label.codeTVA} value={codeTVA} onchange={handleInputChange}
                            data-form-element>
                        </lightning-input>
                    </div>
                </template>

                <!-- Street | City -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                    <lightning-input name="streetNumber" label={label.shippingStreet}
                        placeholder={label.shippingStreetPlaceholder} value={streetNumber} onchange={handleInputChange}
                        required data-form-element disabled={lockCompanyFields} read-only={lockCompanyFields}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                    <lightning-input name="city" label={label.shippingCity} placeholder={label.shippingCityPlaceholder}
                        value={city} onchange={handleInputChange} required data-form-element
                        disabled={lockCompanyFields} read-only={lockCompanyFields}>
                    </lightning-input>
                </div>

                <!-- Postal Code | Country -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                    <lightning-input name="postalCode" label={label.shippingPostalCode}
                        placeholder={label.shippingPostalCodePlaceholder} value={postalCode}
                        onchange={handleInputChange} required data-form-element
                        disabled={lockCompanyFields} read-only={lockCompanyFields}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_6-of-12">
                    <lightning-input name="pays" label={label.shippingCountry}
                        placeholder={label.shippingCountryPlaceholder} value={pays} onchange={handleInputChange}
                        required data-form-element disabled={lockCompanyFields} read-only={lockCompanyFields}>
                    </lightning-input>
                </div>

                <!-- Subject to VAT checkbox -->
                <div class="slds-col slds-size_1-of-1">
                    <lightning-input type="checkbox" label={label.subjectToVat} checked={vatCheckbox} name="vatCheckbox"
                        onchange={handleInputChange} data-form-element></lightning-input>
                </div>
            </div>
        </template>
    </div>
</template>
