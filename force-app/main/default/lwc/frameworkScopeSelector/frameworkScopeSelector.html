<template>
    <lightning-card title="Define Framework Scope" icon-name="standard:account">
        <div class="slds-p-around_medium">

            <!-- Loading spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
            </template>

            <!-- Generic error -->
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- No scope records exist for this Quote -->
            <template if:true={noRecordsFound}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                    <h2>No entities found for this Quote. Please contact support.</h2>
                </div>
                <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                    <lightning-button label="Close" variant="neutral" onclick={handleCancel}></lightning-button>
                </div>
            </template>

            <!-- ── STEP 1: SELECT ─────────────────────────────────────────── -->
            <template if:true={isSelectStep}>
                <template if:false={noRecordsFound}>
                    <p class="slds-m-bottom_small slds-text-body_regular">
                        Select the entities to include in this framework agreement.
                        The <strong>Previously Included</strong> column shows your last saved selection.
                    </p>

                    <!-- Validation warning -->
                    <template if:true={validationMessage}>
                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                            <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                            <h2>{validationMessage}</h2>
                        </div>
                    </template>

                    <lightning-datatable
                        key-field="Id"
                        data={scopeRecords}
                        columns={columns}
                        selected-rows={selectedRowIds}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>

                    <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleCancel}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        <lightning-button
                            label="Next"
                            variant="brand"
                            onclick={handleNext}
                            disabled={isNextDisabled}>
                        </lightning-button>
                    </div>
                </template>
            </template>

            <!-- ── STEP 2: CONFIRM ───────────────────────────────────────── -->
            <template if:true={isConfirmStep}>
                <p class="slds-text-heading_small slds-m-bottom_small">{confirmationMessage}</p>

                <ul class="slds-list_dotted slds-m-bottom_medium">
                    <template for:each={selectedRecords} for:item="rec">
                        <li key={rec.Id}>
                            {rec.Entity_Name__c}
                            <template if:true={rec.Entity_Legal_Registration_Number__c}>
                                &nbsp;— {rec.Entity_Legal_Registration_Number__c}
                            </template>
                        </li>
                    </template>
                </ul>

                <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                    <lightning-button
                        label="Back"
                        variant="neutral"
                        onclick={handleBack}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <lightning-button
                        label="Confirm &amp; Save"
                        variant="brand"
                        onclick={handleConfirm}
                        disabled={isConfirmDisabled}>
                    </lightning-button>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
