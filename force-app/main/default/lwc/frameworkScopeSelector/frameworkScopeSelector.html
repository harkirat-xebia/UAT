<template>
    <lightning-card title="Define Framework Scope" icon-name="standard:account">
        <div class="slds-p-around_medium">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <template if:true={hasRecords}>
                <p class="slds-m-bottom_small">
                    Select the entities to include in this framework agreement, then click <strong>Confirm &amp; Save</strong>.
                </p>
                <lightning-datatable
                    key-field="Id"
                    data={scopeRecords}
                    columns={columns}
                    selected-rows={selectedRowIds}
                    onrowselection={handleRowSelection}>
                </lightning-datatable>
            </template>

            <template if:false={hasRecords}>
                <template if:false={isLoading}>
                    <p class="slds-text-color_weak slds-m-bottom_medium">
                        No framework scope entities found for this Quote.
                    </p>
                </template>
            </template>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Confirm &amp; Save"
                    variant="brand"
                    onclick={handleConfirm}
                    disabled={isConfirmDisabled}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
