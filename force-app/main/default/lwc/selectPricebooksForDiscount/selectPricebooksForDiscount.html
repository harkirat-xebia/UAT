<template>
    <lightning-card title="Create Discounted Products" icon-name="standard:product">
        <div class="slds-p-around_medium">

            <!-- Display Current Discount Code Info -->
            <template if:true={discountCodeInfo}>
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <p class="slds-m-bottom_x-small">
                                <span class="slds-text-color_weak">Discount Code: </span>
                                <strong>{discountCodeInfo.ER_Promo_Code__c}</strong>
                            </p>
                            <p>
                                <span class="slds-text-color_weak">Name: </span>
                                {discountCodeInfo.Name}
                            </p>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <p class="slds-m-bottom_x-small">
                                <span class="slds-text-color_weak">Discount: </span>
                                {discountCodeInfo.Discount_Percentage__c}%
                            </p>
                            <p>
                                <span class="slds-text-color_weak">Solution: </span>
                                {discountCodeInfo.Solution__c}
                            </p>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Warning: ANY pricebook already has PBEs — block all further creation -->
            <template if:true={anyPricebookAlreadyCreated}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">warning</span>
                    <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                    <h2>Pricebook entries have already been created for this discount code. To re-create or add entries for additional pricebooks, contact your administrator.</h2>
                </div>
            </template>

            <!-- Show Pricebooks -->
            <template if:true={showPricebooks}>
                <div class="slds-m-bottom_medium">
                    <div class="slds-text-heading_small slds-m-bottom_small">
                        Select Pricebooks to Create Discounted Products
                    </div>

                    <!-- Select All / Deselect All -->
                    <div class="slds-m-bottom_small">
                        <lightning-button
                            label="Select All"
                            onclick={handleSelectAll}
                            variant="neutral"
                            class="slds-m-right_x-small"
                            disabled={isProcessing}>
                        </lightning-button>
                        <lightning-button
                            label="Deselect All"
                            onclick={handleDeselectAll}
                            variant="neutral"
                            disabled={isProcessing}>
                        </lightning-button>
                    </div>

                    <!-- Pricebook List -->
                    <div class="pricebook-container">
                        <template if:true={isLoadingPricebooks}>
                            <lightning-spinner alternative-text="Loading pricebooks..." size="small"></lightning-spinner>
                        </template>

                        <template if:false={isLoadingPricebooks}>
                            <template if:true={hasPricebooks}>
                                <div>
                                    <template for:each={pricebooks} for:item="pb">
                                        <div key={pb.Id} class="slds-p-around_x-small">
                                            <lightning-input
                                                type="checkbox"
                                                label={pb.Name}
                                                value={pb.Id}
                                                checked={pb.isSelected}
                                                onchange={handlePricebookSelection}
                                                data-id={pb.Id}
                                                disabled={anyPricebookAlreadyCreated}>
                                            </lightning-input>
                                            <template if:true={pb.Description}>
                                                <div class="slds-text-body_small slds-text-color_weak slds-m-left_large">
                                                    {pb.Description}
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template if:false={hasPricebooks}>
                                <div class="slds-text-align_center slds-p-around_medium">
                                    <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                    <p class="slds-text-color_weak slds-m-top_small">
                                        No active pricebooks found for this discount code's solution.
                                    </p>
                                </div>
                            </template>
                        </template>
                    </div>

                    <!-- Selected Count -->
                    <template if:true={selectedCount}>
                        <div class="slds-m-top_small slds-text-body_small">
                            <lightning-icon icon-name="utility:check" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <strong>{selectedCount}</strong> pricebook(s) selected
                        </div>
                    </template>
                </div>

                <!-- Action Buttons -->
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Create Discounted Products"
                        variant="brand"
                        onclick={handleCreateDiscounts}
                        disabled={isCreateDisabled}
                        icon-name="utility:add"
                        class="slds-m-right_x-small">
                    </lightning-button>
                </div>
            </template>

            <!-- Processing Spinner -->
            <template if:true={isProcessing}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Creating discounted products..." size="medium"></lightning-spinner>
                    <p class="slds-text-align_center slds-m-top_small">
                        Processing... This may take a few minutes.
                    </p>
                </div>
            </template>

            <!-- Success/Error Messages -->
            <template if:true={successMessage}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-alert_success" role="alert">
                        <span class="slds-assistive-text">success</span>
                        <lightning-icon icon-name="utility:success" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                        <h2>{successMessage}</h2>
                    </div>
                </div>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                        <h2>{errorMessage}</h2>
                    </div>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
