<template>
    <template if:true={showCard}>
        <lightning-card title={cardTitle} icon-name="standard:record">
            <template if:true={hasMissingRequired}>
                <span slot="actions" class="slds-badge slds-theme_error">{missingRequiredLabel}</span>
            </template>

            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>

                <template if:true={error}>
                    <c-error-panel errors={error} type="inlineMessage"></c-error-panel>
                </template>

                <template if:true={showFields}>
                    <ul class="slds-m-top_x-small insight-list">
                        <template for:each={fieldItems} for:item="item">
                            <li key={item.key} class={item.rowClass}>
                                <div
                                    class="slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center slds-p-vertical_xx-small slds-p-horizontal_x-small"
                                >
                                    <div class="slds-grid slds-grid_vertical-align-center insight-row_content">
                                        <lightning-icon
                                            icon-name={item.iconName}
                                            size="x-small"
                                            variant={item.iconVariant}
                                            class="slds-m-right_x-small"
                                        ></lightning-icon>

                                        <template if:false={item.isLookup}>
                                            <span class="slds-truncate {item.labelClass}">{item.label}</span>
                                            <template if:true={item.displayValue}>
                                                <span class="slds-text-color_weak slds-m-left_x-small slds-truncate"
                                                    >{item.displayValue}</span
                                                >
                                            </template>
                                        </template>

                                        <template if:true={item.isLookup}>
                                            <span class="slds-truncate {item.labelClass}">{item.headingText}</span>
                                        </template>
                                    </div>

                                    <template if:true={item.showBadge}>
                                        <span class="slds-badge slds-theme_error slds-no-flex">{item.badgeText}</span>
                                    </template>
                                </div>

                                <!-- Duplicate matches: each one navigates to the record it found -->
                                <template if:true={item.matches.length}>
                                    <div class="slds-p-left_large slds-p-bottom_xx-small">
                                        <template for:each={item.matches} for:item="match">
                                            <div
                                                key={match.recordId}
                                                class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small"
                                            >
                                                <a
                                                    href={match.url}
                                                    title={match.displayLabel}
                                                    data-id={match.recordId}
                                                    onclick={handleMatchClick}
                                                    class="slds-button slds-button_outline-brand slds-m-right_xx-small"
                                                    >{match.displayLabel}</a
                                                >

                                                <!-- harkirat - action button, only when the server says this match is eligible -->
                                                <template if:true={match.showEligible}>
                                                    <lightning-button
                                                        variant="brand"
                                                        label={item.actionButtonLabel}
                                                        data-id={match.recordId}
                                                        onclick={handleActionClick}
                                                        class="slds-no-flex"
                                                    ></lightning-button>
                                                </template>
                                                <template if:true={match.showBlockedReason}>
                                                    <lightning-helptext
                                                        content={match.blockedReason}
                                                    ></lightning-helptext>
                                                </template>
                                            </div>
                                        </template>

                                        <!-- harkirat - only when more than one contract here can be amended -->
                                        <template if:true={item.showMultipleContractsWarning}>
                                            <div class="slds-grid slds-m-top_xx-small">
                                                <lightning-icon
                                                    icon-name="utility:warning"
                                                    size="xx-small"
                                                    variant="warning"
                                                    class="slds-m-right_xx-small"
                                                ></lightning-icon>
                                                <span class="slds-text-body_small insight-text_recommended"
                                                    >{item.multipleContractsMessage}</span
                                                >
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>

                <!-- Warnings and Information, separated by the SLDS grey divider -->
                <template if:true={showMessages}>
                    <div class="slds-has-divider_top-space slds-m-top_small slds-p-top_x-small">
                        <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">
                            Warnings &amp; Information
                        </p>
                        <template for:each={messageItems} for:item="msg">
                            <div key={msg.key} class="slds-grid slds-m-top_xx-small">
                                <lightning-icon
                                    icon-name={msg.iconName}
                                    size="x-small"
                                    variant={msg.iconVariant}
                                    class="slds-m-right_x-small"
                                ></lightning-icon>
                                <span class="slds-text-body_small">{msg.message}</span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </lightning-card>
    </template>
</template>
