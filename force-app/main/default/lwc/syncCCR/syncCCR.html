<template>
    <lightning-card title="Sync CCR to OCR">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner size="medium"></lightning-spinner>
            </template>

            <template if:true={showConfirmation}>
                <p>Do you want to synchronize Contract Contact Roles with the related Opportunity?</p>
                <div class="slds-m-top_medium">
                    <lightning-button variant="brand" label="Yes, Sync Now" onclick={handleConfirm}></lightning-button>
                    <lightning-button variant="neutral" label="Cancel" class="slds-m-left_small" onclick={handleCancel}></lightning-button>
                </div>
            </template>

            <template if:true={message}>
                <p class="slds-text-color_success slds-text-heading_small slds-m-top_medium">{message}</p>
            </template>
        </div>
    </lightning-card>
</template>
