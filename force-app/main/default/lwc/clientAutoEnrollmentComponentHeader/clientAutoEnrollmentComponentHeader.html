<template>
    <div class="navbar-custom slds-grid slds-grid_align-spread slds-p-around_small">
        <div class="logo-container">
            <img src={logoUrl} alt="Logo" class="logo" />
        </div>

        <div class="language-container slds-align-middle">
            <lightning-combobox name="language" label="Language" value={selectedLanguage} options={languageOptions}
                onchange={handleLanguageChange} variant="label-hidden" class="language-dropdown">
            </lightning-combobox>
        </div>
    </div>

    
</template>
